<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" fill="none" role="img" aria-label="Logo El Pibes con gorrito de Link">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="360" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#272264" />
    </linearGradient>
    <linearGradient id="cap-body" x1="68" y1="16" x2="210" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="cap-brim" x1="56" y1="54" x2="150" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="60%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>
    <linearGradient id="gold-triforce" x1="75" y1="58" x2="96" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#FFC700" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <rect width="360" height="150" rx="20" fill="url(#bg-grad)" stroke="#FF2A5F" stroke-opacity="0.45" stroke-width="2" />

  <!-- Gorrito de Link inclinado sobre "EL" -->
  <g transform="translate(46, 2) rotate(-8 50 40)">
    <path
      d="M22 58 C24 30, 44 10, 78 12 C110 14, 138 28, 156 46 C140 40, 118 36, 90 56 Z"
      fill="url(#cap-body)"
      stroke="#4ADE80"
      stroke-opacity="0.6"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <path
      d="M36 40 C50 20, 82 18, 120 32"
      stroke="#A7F3D0"
      stroke-opacity="0.5"
      stroke-width="2.2"
      stroke-linecap="round"
    />
    <path
      d="M14 60 C32 50, 68 48, 96 56 C100 58, 98 69, 90 71 C66 64, 34 66, 18 71 C12 71, 10 62, 14 60 Z"
      fill="url(#cap-brim)"
      stroke="#4ADE80"
      stroke-opacity="0.65"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <path d="M41 55 L45 61.5 H37 Z" fill="url(#gold-triforce)" />
    <path d="M37 61.5 L41 68 H33 Z" fill="url(#gold-triforce)" />
    <path d="M45 61.5 L49 68 H41 Z" fill="url(#gold-triforce)" />
  </g>

  <!-- Texto EL PIBES -->
  <text
    x="180"
    y="112"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="44"
    letter-spacing="4"
    fill="#FFFFFF"
  >
    EL <tspan fill="#FFC700">PIBES</tspan>
  </text>

  <text
    x="180"
    y="132"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-weight="700"
    font-size="11"
    letter-spacing="5"
    fill="#C7D2FE"
  >
    DIGITAL STORE
  </text>
</svg>
