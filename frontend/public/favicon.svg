<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="El Pibes">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#272264" />
    </linearGradient>
    <linearGradient id="fav-cap-body" x1="12" y1="6" x2="58" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="fav-cap-brim" x1="8" y1="22" x2="42" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="60%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>
    <linearGradient id="fav-triforce" x1="16" y1="23" x2="25" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#FFC700" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Fondo redondeado oficial El Pibes -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#fav-bg)" stroke="#FF2A5F" stroke-opacity="0.55" stroke-width="2.5" />

  <!-- Gorrito de Link inclinado con doblez y Trifuerza -->
  <g transform="rotate(-8 32 20)">
    <path
      d="M11 26 C12 15 22 6 36 7 C49 8 57 14 60 21 C54 19 46 18 37 25 Z"
      fill="url(#fav-cap-body)"
      stroke="#4ADE80"
      stroke-opacity="0.65"
      stroke-width="1.3"
      stroke-linejoin="round"
    />
    <path
      d="M16 19 C22 11 35 10 49 15.5"
      stroke="#A7F3D0"
      stroke-opacity="0.55"
      stroke-width="1.4"
      stroke-linecap="round"
    />
    <path
      d="M8 26.5 C16 22.5 30 22 41 25 C42.5 26 42 31 39 32 C29 29 17 29.5 10 31.8 C7.5 31.8 7 27.8 8 26.5 Z"
      fill="url(#fav-cap-brim)"
      stroke="#4ADE80"
      stroke-opacity="0.7"
      stroke-width="1.3"
      stroke-linejoin="round"
    />
    <!-- Insignia Trifuerza dorada -->
    <path d="M20 23.2 L22.4 27.2 H17.6 Z" fill="url(#fav-triforce)" />
    <path d="M17.6 27.2 L20 31.2 H15.2 Z" fill="url(#fav-triforce)" />
    <path d="M22.4 27.2 L24.8 31.2 H20 Z" fill="url(#fav-triforce)" />
  </g>

  <!-- Monograma EP de alto contraste para legibilidad 16x16 / 32x32 -->
  <path
    d="M15 38 H29 V42 H20 V44.8 H27.5 V48.2 H20 V51 H29 V55 H15 Z"
    fill="#FFFFFF"
  />
  <path
    fill-rule="evenodd"
    d="M34 38 H43.5 C47.2 38 49.5 40.3 49.5 43.8 C49.5 47.3 47.2 49.5 43.5 49.5 H39 V55 H34 Z M39 41.6 V45.9 H42.8 C44.2 45.9 45 45.1 45 43.8 C45 42.4 44.2 41.6 42.8 41.6 Z"
    fill="#FFC700"
  />
</svg>
